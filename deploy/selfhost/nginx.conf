server {
    listen 80;
    listen [::]:80;
    server_name chat.547626.xyz matrix.547626.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.547626.xyz;
    root /opt/radish-chat/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/radish-chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radish-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;

    location = /source {
        return 302 https://github.com/radish40/element-web;
    }
    location ~ ^/(config.*\.json|index\.html|version|revision\.json)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.547626.xyz;
    ssl_certificate /etc/letsencrypt/live/radish-chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radish-chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(_matrix|_synapse/client)/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
    }
    location / {
        return 404;
    }
}
